<h1>Steam Mini</h1>

<form method="GET">

    <input
        type="text"
        name="search"
        placeholder="Введите игру">

    <button type="submit">
        Найти
    </button>

</form>

<hr>



{% for game in games %}

<a href="{% url 'game_detail' game.id %}">
    {{ game.name }}
</a>

<br>

{% endfor %}


{% if search and not games %}

    <h2>
        Игра не найдена 😔
    </h2>

    <p>
        Попробуйте изменить запрос
    </p>

{% endif %}
