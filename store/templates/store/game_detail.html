{% extends "store/base.html" %}


{% block content %}


<h2>
    {{ game.name }}
</h2>


<p>
    Жанр:
    {{ game.genre }}
</p>


<p>
    Описание:
    {{ game.description }}
</p>


<p>
    Цена:
    {{ game.price }} ₽
</p>


<p>
    Дата выхода:
    {{ game.release_date }}
</p>

{% if owned %}

    <p>
        ✅ Игра уже куплена
    </p>


{% else %}

    <a href="{% url 'buy_game' game.id %}">
        Купить игру
    </a>


{% endif %}

{% endblock %}
