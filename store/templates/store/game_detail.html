<h1>{{ game.name }}</h1>


<p>
Цена: {{ game.price }} ₽
</p>


<p>
Жанр: {{ game.genre }}
</p>


<p>
Дата выхода: {{ game.release_date }}
</p>


<p>
Описание:
{{ game.description }}
</p>

<form action="{% url 'buy_game' game.id %}" method="POST">

    {% csrf_token %}

    {% if owned %}

    <p>✓ Уже в библиотеке</p>

    {% else %}

    <button type="submit">Купить</button>

    {% endif %}

</form>

<a href="{% url 'games' %}">
    Назад к играм
</a>
