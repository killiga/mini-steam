{% extends "store/base.html" %}

{% block content %}

<h2>Моя библиотека</h2>

{% if purchases %}

    {% for purchase in purchases %}

        <div style="margin-bottom: 10px;">

            <a href="{% url 'game_detail' purchase.game.id %}">
                {{ purchase.game.name }}
            </a>

        </div>

    {% endfor %}

{% else %}

    <p>У вас пока нет купленных игр.</p>

{% endif %}

{% endblock %}
